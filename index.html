<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Habits" />
  <meta name="theme-color" content="#12121C" />
  <title>Daily Habits</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #12121C;
      color: #E8E8F0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    .header {
      padding: calc(env(safe-area-inset-top) + 40px) 24px 20px;
      background: linear-gradient(180deg, #1A1A2E 0%, #12121C 100%);
      border-bottom: 1px solid #1F1F30;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .day-label {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #E8E8F0;
    }

    .date-label {
      font-size: 14px;
      color: #888;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1F1A35;
      border: 1px solid #3A2E6A;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #8B78D8;
    }

    .reset-btn {
      background: none;
      border: 1px solid #2A2A3A;
      color: #888;
      font-size: 20px;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Progress ── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #2A2A3A;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
      background: linear-gradient(90deg, #F4A24D, #8B78D8);
    }

    .progress-fill.complete { background: #5CC98A; }

    .progress-label {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      min-width: 72px;
      text-align: right;
    }

    /* ── Date nav ── */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #15151F;
      border-bottom: 1px solid #1F1F30;
    }

    .date-nav-btn {
      background: none;
      border: 1px solid #2A2A3A;
      color: #888;
      font-size: 18px;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .date-nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .date-nav-center {
      text-align: center;
    }

    .date-nav-label {
      font-size: 14px;
      font-weight: 600;
      color: #E8E8F0;
    }

    .date-nav-sub {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }

    .today-btn {
      background: #8B78D8;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .past-banner {
      background: #1A1510;
      border-bottom: 1px solid #2A2010;
      padding: 8px 24px;
      font-size: 12px;
      color: #F4A24D;
      text-align: center;
    }

    /* ── Body ── */
    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #1A1A28;
      border-radius: 18px;
      padding: 4px 16px 8px;
      border: 1px solid #222233;
    }

    /* ── Task item ── */
    .item-wrap { border-top: 1px solid #222233; }
    .item-wrap:first-child { border-top: none; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0 8px;
      transition: opacity 0.2s;
    }

    .item-row.done { opacity: 0.45; }

    .checkbox {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid #3A3A4A;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .checkbox.checked { background: #8B78D8; border-color: #8B78D8; }
    .checkbox svg { display: none; }
    .checkbox.checked svg { display: block; }

    .item-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
      color: #E8E8F0;
      transition: all 0.2s;
    }

    .item-text.done { text-decoration: line-through; color: #555; }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .note-btn, .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 16px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      border-radius: 6px;
    }

    .note-btn { color: #444; }
    .note-btn.has-note { color: #8B78D8; }
    .delete-btn { color: #3A3A4A; font-size: 20px; }

    /* ── Note area ── */
    .note-area { padding-bottom: 10px; }

    .note-input {
      width: 100%;
      background: #0E0E1A;
      border: 1px solid #2A2A3A;
      border-radius: 12px;
      padding: 10px 13px;
      color: #C8C8E0;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      resize: none;
      font-family: inherit;
    }

    .note-input::placeholder { color: #444; }

    /* ── Add task ── */
    .add-trigger {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 500;
      color: #8B78D8;
      cursor: pointer;
      padding: 10px 0 4px;
      display: block;
      width: 100%;
      text-align: left;
      border-top: 1px solid #222233;
      margin-top: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .add-row {
      display: flex;
      gap: 8px;
      padding: 10px 0 4px;
      border-top: 1px solid #222233;
      margin-top: 4px;
    }

    .add-input {
      flex: 1;
      background: #0E0E1A;
      border: 1px solid #2A2A3A;
      border-radius: 10px;
      padding: 9px 12px;
      color: #E8E8F0;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .add-input::placeholder { color: #444; }

    .add-confirm {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: #8B78D8;
      -webkit-tap-highlight-color: transparent;
    }

    .add-cancel {
      background: none;
      border: 1px solid #2A2A3A;
      border-radius: 10px;
      color: #666;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Done banner ── */
    .done-banner {
      text-align: center;
      padding: 16px;
      font-size: 15px;
      color: #5CC98A;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* ── History summary card ── */
    .history-card {
      background: #1A1A28;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid #222233;
    }

    .history-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #1F1F30;
      font-size: 14px;
    }

    .history-row:first-of-type { border-top: none; }

    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .history-dot.complete { background: #5CC98A; }
    .history-dot.partial { background: #F4A24D; }
    .history-dot.empty { background: #2A2A3A; }

    .history-date { color: #AAAACC; flex: 1; margin-left: 10px; }
    .history-count { color: #666; font-size: 13px; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  const DEFAULT_ITEMS = [
    { id: '1', text: 'No cheat meals or junk food' },
    { id: '2', text: 'Drink 2 Yeti bottles of water' },
    { id: '3', text: 'Read minimum 10 pages of current book' },
    { id: '4', text: 'Minimum of 15 minutes physical activity' },
    { id: '5', text: 'Journal daily reflection' },
  ];

  function dateKey(d) {
    return d.toDateString();
  }

  function formatDisplay(d) {
    return d.toLocaleDateString('en-AU', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function formatShort(d) {
    return d.toLocaleDateString('en-AU', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function isToday(d) {
    return dateKey(d) === dateKey(new Date());
  }

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  }

  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }

  // ── State ──
  let items = load('dh_items', DEFAULT_ITEMS);
  let allChecked = load('dh_all_checked', {}); // { "Mon Jul 7 2026": { id: bool, ... }, ... }
  let allNotes = load('dh_all_notes', {});     // { "Mon Jul 7 2026": { id: "note text", ... }, ... }
  let viewDate = new Date();
  let expandedNote = null;
  let addingNew = false;

  // Migrate old single-day data if exists
  (function migrate() {
    const oldChecked = load('dh_checked', null);
    const oldNotes = load('dh_notes', null);
    if (oldChecked && oldChecked.date && oldChecked.state) {
      if (!allChecked[oldChecked.date]) {
        allChecked[oldChecked.date] = oldChecked.state;
        save('dh_all_checked', allChecked);
      }
    }
    if (oldNotes) {
      const today = dateKey(new Date());
      if (!allNotes[today]) {
        allNotes[today] = oldNotes;
        save('dh_all_notes', allNotes);
      }
    }
  })();

  function getCheckedForDate(d) {
    return allChecked[dateKey(d)] || {};
  }

  function getNotesForDate(d) {
    return allNotes[dateKey(d)] || {};
  }

  function setCheckedForDate(d, state) {
    allChecked[dateKey(d)] = state;
    save('dh_all_checked', allChecked);
  }

  function setNotesForDate(d, notes) {
    allNotes[dateKey(d)] = notes;
    save('dh_all_notes', allNotes);
  }

  // ── Streak ──
  function calcStreak() {
    let streak = 0;
    let d = new Date();
    // If today not complete, start checking from yesterday
    const todayChecked = getCheckedForDate(d);
    const todayDone = Object.values(todayChecked).filter(Boolean).length;
    if (todayDone < items.length) {
      d.setDate(d.getDate() - 1);
    }
    for (let i = 0; i < 365; i++) {
      const checked = getCheckedForDate(d);
      const done = Object.values(checked).filter(Boolean).length;
      if (done >= items.length && items.length > 0) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  // ── Recent history (last 7 days) ──
  function getRecentHistory() {
    const days = [];
    for (let i = 1; i <= 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const checked = getCheckedForDate(d);
      const done = Object.values(checked).filter(Boolean).length;
      days.push({ date: d, done, total: items.length });
    }
    return days;
  }

  // ── Render ──
  function render() {
    const app = document.getElementById('app');
    const checked = getCheckedForDate(viewDate);
    const notes = getNotesForDate(viewDate);
    const total = items.length;
    const done = Object.values(checked).filter(Boolean).length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    const allDone = pct === 100 && total > 0;
    const viewing = isToday(viewDate);
    const streak = calcStreak();
    const history = getRecentHistory();

    const dayName = viewDate.toLocaleDateString('en-AU', { weekday: 'long' });
    const dateStr = viewDate.toLocaleDateString('en-AU', { month: 'long', day: 'numeric' });

    // Prev/next dates
    const prevDate = new Date(viewDate);
    prevDate.setDate(prevDate.getDate() - 1);
    const nextDate = new Date(viewDate);
    nextDate.setDate(nextDate.getDate() + 1);
    const canGoNext = !isToday(viewDate);

    app.innerHTML = `
      <div class="header">
        <div class="header-top">
          <div>
            <div class="day-label">${dayName}</div>
            <div class="date-label">${dateStr}</div>
          </div>
          <div class="header-right">
            ${streak > 0 ? `<div class="streak-badge">🔥 ${streak} day${streak !== 1 ? 's' : ''}</div>` : ''}
            ${viewing ? `<button class="reset-btn" onclick="resetAll()" title="Reset today">↺</button>` : ''}
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill ${allDone ? 'complete' : ''}" style="width:${pct}%"></div>
          </div>
          <div class="progress-label">${allDone ? '🎉 All done!' : `${done} of ${total}`}</div>
        </div>
      </div>

      <!-- Date navigation -->
      <div class="date-nav">
        <button class="date-nav-btn" onclick="goToPrev()">‹</button>
        <div class="date-nav-center">
          <div class="date-nav-label">${viewing ? 'Today' : formatShort(viewDate)}</div>
          ${!viewing ? `<button class="today-btn" onclick="goToToday()">Back to Today</button>` : '<div class="date-nav-sub">Swipe to view past days</div>'}
        </div>
        <button class="date-nav-btn" onclick="goToNext()" ${!canGoNext ? 'disabled' : ''}>›</button>
      </div>

      ${!viewing ? `<div class="past-banner">📅 Viewing ${formatShort(viewDate)} — tap tasks to edit</div>` : ''}

      <div class="body">
        <div class="card">
          ${items.map((item, i) => {
            const isDone = !!checked[item.id];
            const isExpanded = expandedNote === item.id;
            const hasNote = !!(notes[item.id] || '').trim();
            return `
              <div class="item-wrap">
                <div class="item-row ${isDone ? 'done' : ''}">
                  <button class="checkbox ${isDone ? 'checked' : ''}" onclick="toggle('${item.id}')">
                    <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
                      <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                  <span class="item-text ${isDone ? 'done' : ''}">${escHtml(item.text)}</span>
                  <div class="item-actions">
                    <button class="note-btn ${hasNote ? 'has-note' : ''}" onclick="toggleNote('${item.id}')">${hasNote ? '📝' : '✏️'}</button>
                    ${viewing ? `<button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>` : ''}
                  </div>
                </div>
                ${isExpanded ? `
                  <div class="note-area">
                    <textarea class="note-input" rows="3" placeholder="Add a note…"
                      onblur="saveNote('${item.id}', this.value)"
                    >${escHtml(notes[item.id] || '')}</textarea>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}

          ${viewing ? (addingNew ? `
            <div class="add-row">
              <input class="add-input" id="new-task-input" placeholder="New task…" onkeydown="handleAddKey(event)" autofocus />
              <button class="add-confirm" onclick="confirmAdd()">Add</button>
              <button class="add-cancel" onclick="cancelAdd()">✕</button>
            </div>
          ` : `
            <button class="add-trigger" onclick="startAdd()">+ Add task</button>
          `) : ''}
        </div>

        ${allDone && viewing ? `<div class="done-banner">You crushed it today! 💪</div>` : ''}

        <!-- History -->
        <div class="history-card">
          <div class="history-title">Last 7 Days</div>
          ${history.map(h => {
            const dotClass = h.done === 0 ? 'empty' : h.done >= h.total ? 'complete' : 'partial';
            const label = h.done === 0 ? 'No data' : h.done >= h.total ? 'All done ✓' : `${h.done}/${h.total} done`;
            return `
              <div class="history-row" onclick="goToDate(${h.date.getTime()})" style="cursor:pointer">
                <div class="history-dot ${dotClass}"></div>
                <div class="history-date">${formatShort(h.date)}</div>
                <div class="history-count">${label}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    if (expandedNote) {
      const ta = app.querySelector('textarea');
      if (ta) {
        const val = ta.value;
        ta.focus();
        ta.setSelectionRange(val.length, val.length);
      }
    }
    if (addingNew) {
      const inp = document.getElementById('new-task-input');
      if (inp) inp.focus();
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Actions ──
  function toggle(id) {
    const checked = { ...getCheckedForDate(viewDate) };
    checked[id] = !checked[id];
    setCheckedForDate(viewDate, checked);
    render();
  }

  function toggleNote(id) {
    expandedNote = expandedNote === id ? null : id;
    render();
  }

  function saveNote(id, val) {
    const notes = { ...getNotesForDate(viewDate) };
    notes[id] = val;
    setNotesForDate(viewDate, notes);
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save('dh_items', items);
    if (expandedNote === id) expandedNote = null;
    render();
  }

  function resetAll() {
    setCheckedForDate(viewDate, {});
    render();
  }

  function startAdd() { addingNew = true; render(); }
  function cancelAdd() { addingNew = false; render(); }

  function confirmAdd() {
    const inp = document.getElementById('new-task-input');
    const text = inp ? inp.value.trim() : '';
    if (!text) return;
    items.push({ id: 'item_' + Date.now(), text });
    save('dh_items', items);
    addingNew = false;
    render();
  }

  function handleAddKey(e) {
    if (e.key === 'Enter') confirmAdd();
    if (e.key === 'Escape') cancelAdd();
  }

  function goToPrev() {
    expandedNote = null;
    addingNew = false;
    viewDate = new Date(viewDate);
    viewDate.setDate(viewDate.getDate() - 1);
    render();
  }

  function goToNext() {
    if (isToday(viewDate)) return;
    expandedNote = null;
    addingNew = false;
    viewDate = new Date(viewDate);
    viewDate.setDate(viewDate.getDate() + 1);
    render();
  }

  function goToToday() {
    expandedNote = null;
    addingNew = false;
    viewDate = new Date();
    render();
  }

  function goToDate(ts) {
    expandedNote = null;
    addingNew = false;
    viewDate = new Date(ts);
    render();
  }

  // ── Auto-reset check at midnight ──
  setInterval(() => { render(); }, 60000);

  render();
</script>
</body>
</html>
